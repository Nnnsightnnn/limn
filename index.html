<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PromptForge — scaffolding</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%; background: #14110f; color: #f0e6d8;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    main {
      display: grid; place-items: center; min-height: 100vh; padding: 2rem;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin: 0 0 0.5rem; letter-spacing: -0.02em; }
    p  { max-width: 48ch; line-height: 1.55; color: #c9b89d; }
    code {
      background: #2a2520; padding: 0.15em 0.4em; border-radius: 4px;
      font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 0.95em;
    }
    .accent { color: #e8a857; }
  </style>
</head>
<body>
  <main>
    <h1><span class="accent">Prompt</span>Forge</h1>
    <p>Scaffold is live. The full app — wizard, free-form chip library, multi-model output, and OpenRouter AI assist — lands in the next commit.</p>
    <p>See the <code>README.md</code> for the planned feature set and roadmap.</p>
  </main>
</body>
</html>
